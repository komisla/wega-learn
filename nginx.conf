server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Challenges-JSON direkt servieren (kein CORS-Problem via HTTP)
    location /challenges/ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|json)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
